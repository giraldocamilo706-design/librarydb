services:
  mongodb-test:
    image: mongo:7.0
    container_name: metcoffee-mongodb-test
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - metcoffee-mongodb-test-data:/data/db

  mongodb-test-init:
    image: mongo:7.0
    depends_on:
      mongodb-test:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongodb-test:27017", "--eval"]
    command:
      - "rs.initiate()"

volumes:
  metcoffee-mongodb-test-data:
